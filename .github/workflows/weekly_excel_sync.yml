name: Weekly Excel Merchants Sync

on:
  # Run once every Monday at 06:00 UTC (11:30 AM IST)
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual trigger at any time from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync-merchants:
    name: Sync Excel Merchants with MongoDB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Run Excel Merchants Sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME || 'sbi_cashback_tracking' }}
        run: |
          python sync_excel_merchants.py
